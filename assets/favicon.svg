<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
>
  <defs>
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#4f7cff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter
      id="shadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feDropShadow
        dx="0"
        dy="2"
        stdDeviation="2"
        flood-color="#000000"
        flood-opacity="0.2"
      />
    </filter>
  </defs>

  <rect
    width="64"
    height="64"
    rx="16"
    fill="url(#background)"
  />

  <text
    x="32"
    y="34"
    font-size="30"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="central"
    filter="url(#shadow)"
  >
    M
  </text>
</svg>